services:
  hoopla-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: hoopla-backend-service
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "8080:8080"
    environment:
      - PYTHONPATH=/app:/app/myvenv/lib/python3.12/site-packages
      - NVIDIA_VISIBLE_DEVICES=all
    restart: unless-stopped
    