dataset:
  data_path: data/image.fits
  noise_path: data/noise.fits
  psf_path: data/psf.fits
  pixel_scale: 0.05
model_components:
  lens_mass_list:
  - type: SIE
    params:
      theta_E:
        prior_type: uniform
        prior_settings:
        - 0.8102
        - 1.2102
        limits:
        - 0.0
        - 10.0
        fixed: false
      e1:
        prior_type: gaussian
        prior_settings:
        - 0.0906
        - 0.1
        limits:
        - -1.0
        - 1.0
        fixed: false
      e2:
        prior_type: gaussian
        prior_settings:
        - 0.0893
        - 0.1
        limits:
        - -1.0
        - 1.0
        fixed: false
      center_x:
        fixed: true
        fixed_value: 0.0
      center_y:
        fixed: true
        fixed_value: 0.0
  - type: SHEAR
    params:
      gamma1:
        prior_type: uniform
        prior_settings:
        - -0.3
        - 0.3
        limits:
        - -0.5
        - 0.5
        fixed: false
      gamma2:
        prior_type: uniform
        prior_settings:
        - -0.3
        - 0.3
        limits:
        - -0.5
        - 0.5
        fixed: false
  source_light_list:
  - type: Sersic
    params:
      R_sersic:
        prior_type: uniform
        prior_settings:
        - 0.8004
        - 1.4004
        limits:
        - 0.0
        - 5.0
        fixed: false
      n_sersic:
        prior_type: uniform
        prior_settings:
        - 3.2726
        - 4.272600000000001
        limits:
        - 0.3
        - 6.0
        fixed: false
      e1:
        prior_type: gaussian
        prior_settings:
        - -0.0667
        - 0.1
        limits:
        - -1.0
        - 1.0
        fixed: false
      e2:
        prior_type: gaussian
        prior_settings:
        - -0.3695
        - 0.1
        limits:
        - -1.0
        - 1.0
        fixed: false
      center_x:
        prior_type: gaussian
        prior_settings:
        - 0.0945
        - 0.1
        limits:
        - -3.0
        - 3.0
        fixed: false
      center_y:
        prior_type: gaussian
        prior_settings:
        - -0.001
        - 0.1
        limits:
        - -3.0
        - 3.0
        fixed: false
      Ie:
        use_linear: true
  lens_light_list:
  - type: Sersic
    params:
      R_sersic:
        prior_type: uniform
        prior_settings:
        - 0.001
        - 4.9001
        limits:
        - 0.0
        - 5.0
        fixed: false
      n_sersic:
        prior_type: gaussian
        prior_settings:
        - 4.0
        - 0.5
        limits:
        - 0.3
        - 6.0
        fixed: false
      e1:
        prior_type: gaussian
        prior_settings:
        - 0.0
        - 0.3
        limits:
        - -1.0
        - 1.0
        fixed: false
      e2:
        prior_type: gaussian
        prior_settings:
        - 0.0
        - 0.3
        limits:
        - -1.0
        - 1.0
        fixed: false
      center_x:
        fixed: true
        fixed_value: 0.0
      center_y:
        fixed: true
        fixed_value: 0.0
      Ie:
        use_linear: true
inference:
  type: sampler
  method: nautilus
  settings:
    nlive: 200
    batch_size: 800
solver_type: nnls
output:
  path: output
  figures:
    results: model_results.png
    corner: model_corner.png
  tables:
    samples: result_samples.csv
    summary: result_summary.csv
  datasets:
    subplot: dataset_subplot.png
